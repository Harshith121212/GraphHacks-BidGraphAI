[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-enrich"
version = "1.0.0"
description = "Standalone synthetic tender requirement enrichment package"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools]
packages = ["tender_enrich"]
package-dir = {tender_enrich = "."}
include-package-data = true

[tool.setuptools.package-data]
tender_enrich = ["seed/*.json"]

